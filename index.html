<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Público no Santoinho</title>
    <meta property="og:title" content="O Público no Santoinho">
    <meta property="og:description" content="Faltam 25 dias para a festa.">
    <meta property="og:image" content="https://publiconosantoinho.vercel.app/santoinho.jpg">
    <meta property="og:url" content="https://publiconosantoinho.vercel.app/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="O Público no Santoinho">
    <meta name="twitter:image" content="https://publiconosantoinho.vercel.app/santoinho.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="publico-bg text-center flex items-center justify-center min-h-screen">
    <!-- Banner Section -->
    <div class="relative w-full max-w-3xl mx-4">
        <!-- Banner Image -->
        <img src="santoinho.jpg" alt="Santoinho Banner" class="w-full h-auto object-cover shadow-md blur-sm opacity-40">

        <!-- Title Overlay -->
        <div class="absolute inset-0 flex flex-col items-center justify-center p-6">
            <div class="publico-rule"></div>
            <p class="publico-kicker">O Público <s>na escola</s> no</p>
            <a href="https://www.santoinho.com/" target="_blank" class="publico-headline publico-headline-link">Santoinho</a>
            <div class="publico-rule"></div>
            <p class="publico-lead">Faltam</p>
            <div id="countdown" class="publico-countdown" style="font-style:normal"></div>
            <div id="countdown-minutes" class="publico-countdown-sub" style="font-style:normal"></div>
            <div id="countdown-seconds" class="publico-countdown-sub" style="font-style:normal"></div>
            <div class="publico-rule" style="margin-top:1.5rem"></div>
        </div>
    </div>

    <script>
        // Define the countdown date
        var countdownDate = new Date("Jul 25, 2026 20:00:00").getTime();

        // Update the countdown every second
        var countdownFunction = setInterval(function() {
            var now = new Date().getTime();
            var distance = countdownDate - now;

            // Calculate time left
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Use singular for 1 and plural for everything else (including 0)
            var daysText = days === 1 ? "dia" : "dias";
            var hoursText = hours === 1 ? "hora" : "horas";
            var minutesText = minutes === 1 ? "minuto" : "minutos";
            var secondsText = seconds === 1 ? "segundo" : "segundos";

            // Display the result
            document.getElementById("countdown").innerHTML =
                days + " " + daysText + " " +
                hours + " " + hoursText + " " +
                minutes + " " + minutesText + " " +
                seconds + " " + secondsText;

            var totalMinutes = Math.floor(distance / (1000 * 60));
            var totalSeconds = Math.floor(distance / 1000);
            var totalMinutesText = totalMinutes === 1 ? "minuto" : "minutos";
            var totalSecondsText = totalSeconds === 1 ? "segundo" : "segundos";
            document.getElementById("countdown-minutes").innerHTML = totalMinutes.toLocaleString("pt-PT").replace(/\s/g, ".") + " " + totalMinutesText;
            document.getElementById("countdown-seconds").innerHTML = totalSeconds.toLocaleString("pt-PT").replace(/\s/g, ".") + " " + totalSecondsText;

            // If the countdown is over
            if (distance < 0) {
                clearInterval(countdownFunction);
                document.getElementById("countdown").innerHTML = "EXPIRED";
            }
        }, 1000);
    </script>
</body>
</html>
